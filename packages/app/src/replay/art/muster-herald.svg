<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Muster-Herald: rearguard officer rallying the whole line (teamBuff), arms flung wide -->
  <!-- legs, braced wide -->
  <rect x="19" y="47" width="5" height="12" rx="1.5" fill="#33414f"/>
  <rect x="35" y="47" width="5" height="12" rx="1.5" fill="#2a3540"/>
  <!-- cloak / body -->
  <path d="M18 27 C18 22 41 22 41 27 L44 48 C44 51 15 51 15 48 Z" fill="#46586e" stroke="#1a222b" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M20 27 L39 47" stroke="#8a2f2f" stroke-width="3" fill="none"/>
  <!-- left arm flung out -->
  <rect x="6" y="24" width="12" height="5" rx="2.5" fill="#b9a78f" stroke="#1a222b" stroke-width="1"/>
  <!-- right arm flung out -->
  <rect x="41" y="24" width="12" height="5" rx="2.5" fill="#b9a78f" stroke="#1a222b" stroke-width="1"/>
  <!-- head, mouth open shouting -->
  <circle cx="30" cy="16" r="7.5" fill="#b9a78f" stroke="#1a222b" stroke-width="1.3"/>
  <path d="M22 13 C22 8 38 8 38 13 Z" fill="#5f7288" stroke="#1a222b" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="31" cy="19" rx="2" ry="2.6" fill="#1a222b"/>
  <circle cx="26" cy="16" r="1.1" fill="#1a222b"/>
  <!-- rally lines broadcasting outward -->
  <path d="M4 18 L11 21" stroke="#c9a24a" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M4 30 L11 28" stroke="#c9a24a" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M60 18 L53 21" stroke="#c9a24a" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M60 30 L53 28" stroke="#c9a24a" stroke-width="1.4" stroke-linecap="round"/>
</svg>
