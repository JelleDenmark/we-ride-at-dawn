name: Deploy to GitHub Pages

# WRAD1 is retired (2026-11-06). The game is no longer built: both channels
# serve the static redirect in retired/ (see retired/README.md).
#   prod /we-ride-at-dawn/      -> https://jelledenmark.github.io/we-ride-at-dawn-2/
#   dev  /we-ride-at-dawn/dev/  -> https://jelledenmark.github.io/we-ride-at-dawn-2/dev/

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble redirect site
        run: |
          set -euo pipefail
          emit() { # $1 = output dir, $2 = redirect target
            mkdir -p "$1"
            for f in index.html 404.html; do
              sed "s#__TARGET__#$2#g" "retired/$f" > "$1/$f"
            done
            cp retired/sw.js "$1/sw.js"
            echo "$GITHUB_SHA" > "$1/version.txt"
          }
          emit site     https://jelledenmark.github.io/we-ride-at-dawn-2/
          emit site/dev https://jelledenmark.github.io/we-ride-at-dawn-2/dev/
          find site -type f | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
